name: CoreRelics
version: 1.0.0
main: it.corerelics.CoreRelicsPlugin
api-version: '1.20'
description: Plugin per la modalità Cacciatori di Reliquie
author: FelpaBlack
commands:
  relic:
    description: Comando principale per le reliquie
    usage: /relic <subcommand>
    permission: corerelics.admin
permissions:
  corerelics.admin:
    description: Permesso per i comandi admin delle reliquie
    default: op
  corerelics.fame:
    description: Permesso per vedere la classifica
    default: true
